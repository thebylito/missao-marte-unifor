// Cliente libGDX compartilhado: Game, telas e a lógica de apresentação.
// Não conhece nenhuma plataforma (desktop, Android): só a API "gdx". Os launchers dependem dele.
plugins {
    id 'java-library'
}

dependencies {
    // "api": quem depende do core (os launchers) também enxerga o núcleo e a API da libGDX
    api project(':nucleo')
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    // Fase 4: fontes TrueType geradas em tempo de execução (as bibliotecas nativas ficam com cada launcher)
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    // Fase 7 (modo shadow): cliente WebSocket em Java puro (MIT), o mesmo no desktop e no Android
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    // só nos testes: implementações "falsas" de Graphics etc., sem janela nem OpenGL
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
}

// Publicação: ./gradlew :android:assembleDebug :lwjgl3:distZip -Pmissaomarte.servidorPadrao=https://missao-marte.thebylito.dev
// grava o endereço do servidor publicado num recurso do core (missaomarte/servidor-padrao.txt), que os launchers usam
// como padrão (ConfiguracaoDoServidor.padraoDoBuild). Sem a propriedade o arquivo fica vazio, e o desenvolvimento
// continua com localhost (desktop) e 10.0.2.2 (emulador).
def servidorPadrao = providers.gradleProperty('missaomarte.servidorPadrao').map { it.trim() }.orElse('')
def gerarServidorPadrao = tasks.register('gerarServidorPadrao') {
    def saida = layout.buildDirectory.dir('generated/servidor-padrao')
    inputs.property('endereco', servidorPadrao)
    outputs.dir(saida)
    doLast {
        def endereco = servidorPadrao.get()
        if (endereco && !(endereco ==~ /https?:\/\/[^\s\/?#@]+(\/[^\s?#]*)?/)) {
            throw new GradleException("missaomarte.servidorPadrao inválido: '$endereco' (use http:// ou https://)")
        }
        def arquivo = saida.get().file('missaomarte/servidor-padrao.txt').asFile
        arquivo.parentFile.mkdirs()
        arquivo.text = endereco
    }
}
sourceSets.main.resources.srcDir(gerarServidorPadrao)

// Os testes do catálogo conferem os arquivos de assets/ na raiz do projeto (imagens, sons e fontes).
tasks.named('test') {
    systemProperty 'missaomarte.assets', rootProject.file('assets').absolutePath
}
