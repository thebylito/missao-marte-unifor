// Launcher desktop: abre a janela (LWJGL3 + OpenGL) e entrega o controle ao core.
plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    // backend desktop da libGDX e as bibliotecas nativas (Windows, Linux e macOS)
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'br.edu.unifor.missaomarte.lwjgl3.Lwjgl3Launcher'
    applicationName = 'missao-marte'   // nome do script gerado pelo installDist
}

// Fase 4: assets/ (sprites, sons e fontes) entra no classpath, e portanto no jar. No desktop, o
// Gdx.files.internal("sprites/nave.png") procura primeiro na pasta de trabalho e depois no classpath.
sourceSets.main.resources.srcDirs += [rootProject.file('assets')]

def macOS = System.getProperty('os.name').toLowerCase().contains('mac')

tasks.named('run') {
    // ranking.json na raiz do projeto, o mesmo arquivo do console
    workingDir = rootProject.projectDir
    if (project.hasProperty('pastaDoJogo')) {
        workingDir = file(project.property('pastaDoJogo'))
    }
    // No macOS a janela (GLFW) precisa rodar na primeira thread do processo.
    // Fora do Gradle, o próprio launcher reinicia a JVM com essa opção (ReinicioNoMacOS).
    if (macOS) {
        jvmArgs '-XstartOnFirstThread'
    }
    if (System.getProperty('missaomarte.semente')) {
        systemProperty 'missaomarte.semente', System.getProperty('missaomarte.semente')
    }
    // Fase 5: ./gradlew :lwjgl3:run -Dmissaomarte.servidor=http://outra-maquina:8080
    if (System.getProperty('missaomarte.servidor')) {
        systemProperty 'missaomarte.servidor', System.getProperty('missaomarte.servidor')
    }
    // Fase 6: ./gradlew :lwjgl3:run -Dmissaomarte.toque=true  (controles de toque, usados com o mouse)
    if (System.getProperty('missaomarte.toque')) {
        systemProperty 'missaomarte.toque', System.getProperty('missaomarte.toque')
    }
}

tasks.named('jar') {
    archiveBaseName = 'missao-marte'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    // java -jar lwjgl3/build/install/missao-marte/lib/missao-marte-3.0.0.jar (encontra os jars vizinhos)
    doFirst {
        manifest.attributes('Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' '))
    }
}

// Pacote nativo: Windows (pasta com "Missao Marte.exe") e macOS ("Missao Marte.app"), com um Java 17 enxuto embutido.
// Quem baixa não instala o Java nem precisa ser administrador: descompacta e abre. O jpackage só gera o pacote do
// sistema em que roda, por isso o GitHub Actions gera cada um na sua máquina (ci.yml). Localmente:
//   ./gradlew :lwjgl3:pacoteNativo -Pmissaomarte.servidorPadrao=https://missao-marte.thebylito.dev
//   -> lwjgl3/build/pacote/Missao Marte.app (macOS) ou lwjgl3/build/pacote/Missao Marte/ (Windows)
// O ranking local vai para ~/.missao-marte (-Dmissaomarte.dados=usuario): aberto com dois cliques, a pasta de
// trabalho pode ser uma pasta do sistema, onde não dá para gravar.
def sistema = System.getProperty('os.name').toLowerCase()
def noMac = sistema.contains('mac')
def noWindows = sistema.contains('windows')
def jpackage = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
        .map { it.metadata.installationPath.file(noWindows ? 'bin/jpackage.exe' : 'bin/jpackage').asFile.absolutePath }

tasks.register('pacoteNativo', Exec) {
    group = 'distribution'
    description = 'Gera o pacote nativo do sistema atual (Windows ou macOS) com o Java embutido.'
    dependsOn 'installDist'
    def destino = layout.buildDirectory.dir('pacote').get().asFile
    def biblioteca = layout.buildDirectory.dir('install/missao-marte/lib').get().asFile
    def jarPrincipal = tasks.named('jar').flatMap { it.archiveFileName }
    inputs.dir(biblioteca)
    outputs.dir(destino)
    doFirst {
        delete destino                   // o jpackage não sobrescreve um pacote que já existe
        executable = jpackage.get()
        args = ['--type', 'app-image',
                '--dest', destino.absolutePath,
                '--name', 'Missao Marte',
                '--app-version', '7.0.0',
                '--vendor', 'Projeto Integrador Unifor',
                '--description', 'Missao Marte: resgate os passageiros e volte a base.',
                '--input', biblioteca.absolutePath,
                '--main-jar', jarPrincipal.get(),
                '--main-class', application.mainClass.get(),
                // jdeps: java.base, java.desktop, java.management, jdk.unsupported; jdk.crypto.ec para o HTTPS/WSS
                '--add-modules', 'java.base,java.desktop,java.management,jdk.unsupported,jdk.crypto.ec',
                '--java-options', '-Dmissaomarte.dados=usuario']
        if (noMac) {
            // a janela (GLFW) precisa da primeira thread; com a opção, o ReinicioNoMacOS não reinicia a JVM
            args += ['--java-options', '-XstartOnFirstThread',
                     '--icon', file('pacote/icone.icns').absolutePath,
                     '--mac-package-identifier', 'br.edu.unifor.missaomarte']
        } else if (noWindows) {
            args += ['--icon', file('pacote/icone.ico').absolutePath]
        }
    }
    doLast {
        if (noMac) {
            // assinatura ad hoc (sem conta paga da Apple): o Mac Apple Silicon exige o app assinado, e baixado da
            // internet ele abre pelo "Abrir mesmo assim" em vez de aparecer como "danificado"
            exec { commandLine 'codesign', '--force', '--deep', '--sign', '-', new File(destino, 'Missao Marte.app').absolutePath }
        }
    }
}
