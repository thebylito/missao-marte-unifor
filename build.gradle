// Fase 3 — build raiz do projeto multi-módulo (DSL Groovy).
// Aqui fica só o que é comum a todos os módulos; cada módulo tem o seu build.gradle.

ext {
    // versão da libGDX num único lugar (usada por core, lwjgl3 e android)
    gdxVersion = '1.14.2'
}

// Fase 6: o módulo android usa o plugin do Android, que não convive com o plugin "java"; as regras comuns abaixo
// valem para os módulos Java (nucleo, console, core e lwjgl3). O android tem as suas no próprio build.gradle.
configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java'

    group = 'br.edu.unifor.missaomarte'
    version = '3.0.0'

    java {
        // Toolchain: compila e executa com JDK 17 mesmo que o "java" padrão da máquina seja outro.
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // BOM: fixa versões compatíveis entre os módulos do JUnit 5
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all'
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
        }
    }
}
