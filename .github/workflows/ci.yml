name: CI

# Testes do jogo e do servidor em cada PR. O "Build & Deploy" também chama este workflow antes de gerar a imagem:
# só chega ao Dokploy uma versão com os testes passando, e o APK e o jogo desktop da página saem daqui.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Endereço que o APK e o jogo desktop publicados usam como padrão (ConfiguracaoDoServidor.padraoDoBuild).
env:
  SERVIDOR_PUBLICADO: https://missao-marte.thebylito.dev

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # build = testes + jar executável (o mesmo bootJar que o Dockerfile gera)
      - run: ./gradlew --no-daemon build

  jogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # O runner já tem o Android SDK (ANDROID_HOME), então o módulo android entra no build.
      - name: Testes, APK e jogo desktop
        run: >
          ./gradlew --no-daemon test :android:assembleDebug :lwjgl3:distZip
          -Pmissaomarte.servidorPadrao=${{ env.SERVIDOR_PUBLICADO }}

      - name: Arquivos da página de downloads
        run: |
          mkdir -p downloads
          cp android/build/outputs/apk/debug/android-debug.apk downloads/missao-marte.apk
          cp lwjgl3/build/distributions/missao-marte-*.zip downloads/missao-marte-desktop.zip
          ls -la downloads

      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: downloads/
          retention-days: 7

  # O jogo para Windows e macOS com o Java embutido (jpackage): quem baixa não instala o Java nem precisa ser
  # administrador. O jpackage só gera o pacote do sistema em que roda, então cada um sai da sua máquina.
  pacotes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: windows
            maquina: windows-latest
            arquivo: missao-marte-windows.zip
          - sistema: macos-apple-silicon
            maquina: macos-15
            arquivo: missao-marte-macos-apple-silicon.zip
          - sistema: macos-intel
            maquina: macos-15-intel
            arquivo: missao-marte-macos-intel.zip
    runs-on: ${{ matrix.maquina }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pacote nativo
        shell: bash
        run: >
          ./gradlew --no-daemon :lwjgl3:pacoteNativo
          -Pmissaomarte.servidorPadrao=${{ env.SERVIDOR_PUBLICADO }}

      # ditto preserva os links simbólicos e a assinatura do .app (um zip comum quebra os dois)
      - name: Zip do macOS
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict "lwjgl3/build/pacote/Missao Marte.app"
          grep -q -- '-XstartOnFirstThread' "lwjgl3/build/pacote/Missao Marte.app/Contents/app/Missao Marte.cfg"
          ditto -c -k --keepParent "lwjgl3/build/pacote/Missao Marte.app" "${{ matrix.arquivo }}"

      - name: Zip do Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "lwjgl3/build/pacote/Missao Marte/Missao Marte.exe")) { throw "o .exe não foi gerado" }
          Select-String -Path "lwjgl3/build/pacote/Missao Marte/app/Missao Marte.cfg" -Pattern "missaomarte.dados=usuario" | Out-Null
          Compress-Archive -Path "lwjgl3/build/pacote/Missao Marte" -DestinationPath "${{ matrix.arquivo }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.sistema }}
          path: ${{ matrix.arquivo }}
          retention-days: 7

  # Só no PR: confere que a imagem ainda constrói, sem publicar nada (a pasta downloads fica só com o .gitkeep).
  imagem:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f servidor/Dockerfile .
