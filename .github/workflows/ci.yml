name: CI

# Testes do jogo e do servidor em cada PR. O "Build & Deploy" também chama este workflow antes de gerar a imagem:
# só chega ao Dokploy uma versão com os testes passando, e o APK e o jogo desktop da página saem daqui.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Endereço que o APK e o jogo desktop publicados usam como padrão (ConfiguracaoDoServidor.padraoDoBuild).
env:
  SERVIDOR_PUBLICADO: https://missao-marte.thebylito.dev

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # build = testes + jar executável (o mesmo bootJar que o Dockerfile gera)
      - run: ./gradlew --no-daemon build

  jogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # O runner já tem o Android SDK (ANDROID_HOME), então o módulo android entra no build.
      - name: Testes, APK e jogo desktop
        run: >
          ./gradlew --no-daemon test :android:assembleDebug :lwjgl3:distZip
          -Pmissaomarte.servidorPadrao=${{ env.SERVIDOR_PUBLICADO }}

      - name: Arquivos da página de downloads
        run: |
          mkdir -p downloads
          cp android/build/outputs/apk/debug/android-debug.apk downloads/missao-marte.apk
          cp lwjgl3/build/distributions/missao-marte-*.zip downloads/missao-marte-desktop.zip
          ls -la downloads

      - uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: downloads/
          retention-days: 7

  # Só no PR: confere que a imagem ainda constrói, sem publicar nada (a pasta downloads fica só com o .gitkeep).
  imagem:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            servidor
