// Fase 5 — servidor Spring Boot: cadastro, login (JWT), histórico de partidas e ranking Top 10.
// Persistência com JPA. Fase 8 (DA-41): PostgreSQL, com o esquema nas migrações do Flyway (src/main/resources/
// db/migration); sem MISSAOMARTE_DB_URL, H2 em arquivo em modo PostgreSQL, para desenvolver só com o JDK.
// Fase 8 (DA-39): compila também o módulo nucleo do jogo (só ele), para gerar e conferir as hordas.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.edu.unifor.missaomarte'
version = '5.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// O nucleo é configurado aqui, porque o build.gradle dele herda o toolchain e o JUnit do build da raiz do jogo,
// que este build não lê. A saída fica em servidor/build/nucleo (o build do jogo continua dono de nucleo/build).
// Os testes do nucleo não rodam aqui: o build da raiz já os roda, com o JUnit dele.
project(':nucleo') {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir('nucleo')
    repositories {
        mavenCentral()
    }
    pluginManager.withPlugin('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs << '-Xlint:all'
        }
        tasks.named('compileTestJava') { enabled = false }
        tasks.named('processTestResources') { enabled = false }
        tasks.named('test') { enabled = false }
    }
}

dependencies {
    implementation project(':nucleo')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Fase 7 (modo shadow): as posições dos outros pilotos em tempo real, por WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    // Fase 8 (DA-41): o esquema do banco é versionado pelo Flyway (no Boot 4, a autoconfiguração vem do starter)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // H2: o banco de desenvolvimento sem Docker, os testes rápidos e a leitura do banco antigo na importação
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // Fase 8 (DA-41): os testes que precisam do PostgreSQL de verdade (pulados quando não há Docker)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'missaomarte.agendador.habilitado', 'false'
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

// bootRun roda na pasta do servidor; sem MISSAOMARTE_DB_URL, o banco H2 fica em ./dados (MISSAOMARTE_DADOS muda o
// lugar)
tasks.named('bootRun') {
    workingDir = projectDir
}

// Um único jar executável, com nome fixo (o Dockerfile copia este arquivo). O jar "plain" não é usado.
tasks.named('bootJar') {
    archiveFileName = 'missao-marte-servidor.jar'
}
tasks.named('jar') {
    enabled = false
}

// CT-10 lê o mesmo contrato versionado que o jogo usará (e a DA-48, o dos ajustes).
tasks.named('processTestResources') {
    from('../docs/api/exemplos') {
        include 'horda.json', 'ajustes.json'
        into 'exemplos'
    }
}
