# Missão Marte — servidor de ranking (Fase 5)
spring.application.name=missao-marte-servidor
server.port=${PORT:8080}

# H2 em arquivo: os dados sobrevivem a reinícios. MISSAOMARTE_DADOS muda o caminho (sem a extensão .mv.db).
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados/missaomarte}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Fase 8 (DA-40): converte as colunas ENUM nativas do H2 em texto. O script roda em toda subida, antes do Hibernate
# (spring.jpa.defer-datasource-initialization continua false), e não muda nada quando já foi aplicado.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:migracoes/enums-para-texto.sql
# Fase 8 (DA-40): sem a lista fechada (check ... in (...)) que o Hibernate grava nas colunas de enum de tabelas novas
spring.jpa.database-platform=br.edu.unifor.missaomarte.servidor.banco.H2SemCheckDeEnum

# Token JWT (HS256). O segredo vem da variável de ambiente e nunca fica no código nem no Git.
# Sem ela, o servidor gera um segredo temporário a cada início (bom para desenvolvimento) e avisa no log.
missaomarte.jwt.segredo=${MISSAOMARTE_JWT_SEGREDO:}
# 30 dias: o jogo guarda a sessão no aparelho e só pede a senha de novo quando o token vence (DA-38)
missaomarte.jwt.validade=P30D

# Respostas de erro no formato RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Verificação de saúde (Sprint 4) e documentação da API
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
# Endereço público do servidor, usado pelo "Try it out" do Swagger (publicação: MISSAOMARTE_URL_PUBLICA)
missaomarte.url-publica=${MISSAOMARTE_URL_PUBLICA:http://localhost:8080}
springdoc.api-docs.path=/v3/api-docs

# Publicação: a página do jogo fica em static/; os downloads (APK e jogo desktop) vêm desta pasta, em /downloads/**
missaomarte.downloads=${MISSAOMARTE_DOWNLOADS:./downloads}

# deixa explícito (e silencia o aviso do springdoc): a documentação fica ligada
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
