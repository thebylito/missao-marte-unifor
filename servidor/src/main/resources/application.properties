# Missão Marte — servidor de ranking (Fase 5)
spring.application.name=missao-marte-servidor
server.port=${PORT:8080}

# Fase 8 (DA-41): PostgreSQL. Na publicação, MISSAOMARTE_DB_URL (jdbc:postgresql://<host>:5432/missaomarte),
# MISSAOMARTE_DB_USUARIO e MISSAOMARTE_DB_SENHA. Sem MISSAOMARTE_DB_URL (./gradlew bootRun, só com o JDK), um H2 em
# arquivo em modo PostgreSQL; MISSAOMARTE_DADOS muda o caminho (sem a extensão .mv.db).
spring.datasource.url=${MISSAOMARTE_DB_URL:jdbc:h2:file:${MISSAOMARTE_DADOS:./dados/missaomarte};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${MISSAOMARTE_DB_USUARIO:sa}
spring.datasource.password=${MISSAOMARTE_DB_SENHA:}
# O esquema vem das migrações do Flyway (classpath:db/migration, V1__..., V2__...). O Hibernate não cria nem altera
# nada: só confere, na subida, que as entidades batem com as tabelas. O dialeto é detectado pela conexão.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Fase 8 (DA-41), só na virada: o banco H2 da Fase 7 (sem a extensão .mv.db, por exemplo /dados/missaomarte), que é
# copiado para o banco novo na subida, se este estiver vazio. Vazia (o padrão), não importa nada.
missaomarte.importar-h2=${MISSAOMARTE_IMPORTAR_H2:}

# Token JWT (HS256). O segredo vem da variável de ambiente e nunca fica no código nem no Git.
# Sem ela, o servidor gera um segredo temporário a cada início (bom para desenvolvimento) e avisa no log.
missaomarte.jwt.segredo=${MISSAOMARTE_JWT_SEGREDO:}
# 30 dias: o jogo guarda a sessão no aparelho e só pede a senha de novo quando o token vence (DA-38)
missaomarte.jwt.validade=P30D

# Respostas de erro no formato RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Verificação de saúde (Sprint 4) e documentação da API
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
# Endereço público do servidor, usado pelo "Try it out" do Swagger (publicação: MISSAOMARTE_URL_PUBLICA)
missaomarte.url-publica=${MISSAOMARTE_URL_PUBLICA:http://localhost:8080}
springdoc.api-docs.path=/v3/api-docs

# Publicação: a página do jogo fica em static/; os downloads (APK e jogo desktop) vêm desta pasta, em /downloads/**
missaomarte.downloads=${MISSAOMARTE_DOWNLOADS:./downloads}

# deixa explícito (e silencia o aviso do springdoc): a documentação fica ligada
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

missaomarte.hordas.segredo=${MISSAOMARTE_HORDA_SEGREDO:}
missaomarte.admins=${MISSAOMARTE_ADMINS:}
