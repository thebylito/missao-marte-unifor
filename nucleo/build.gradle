// Núcleo do jogo: domínio, aplicação e o ranking em arquivo.
// Não tem nenhuma dependência além do JDK. Como a libGDX nem está no classpath deste módulo,
// um "import com.badlogic..." aqui não compila: a regra "o domínio não depende da libGDX"
// é garantida pelo build, não só por convenção.
plugins {
    id 'java-library'
}

// Condutor compartilhado apenas entre testes e instrumentação, sem integrar o jogo.
sourceSets.test.java.srcDir(rootProject.file('validacao/historia/piloto'))
